<section class="modulex-sa3" id="sa3-{{id}}" style="--sa3-n:{{sa3n}}">
  <div class="modulex-sa3-wrap">
    <div class="modulex-sa3-halka">
      {{sa3hub}}
      <ol class="modulex-sa3-list" aria-label="{{listLabel}}">{{sa3steps}}</ol>
    </div>
  </div>
</section>

<style>
  /* Dairesel Süreç Döngüsü (surec-adimlar-3). Konum: rotate(a) → translateY(-r) → rotate(-a); r = halka genişliğinin %38'i (cqi). */
  .modulex-sa3 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(40px, 7vw, 88px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-sa3 *, .modulex-sa3 *::before, .modulex-sa3 *::after { box-sizing: border-box; }
  .modulex-sa3 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-sa3-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-sa3-halka { position: relative; container-type: inline-size; width: 100%; aspect-ratio: 1 / 1; max-width: 860px; margin-inline: auto; }
  /* halka çizgisi */
  .modulex-sa3-halka::before {
    content: ""; position: absolute; inset: 12%; border-radius: 50%;
    border: 2px dashed color-mix(in srgb, --accent-- 55%, transparent);
  }
  .modulex-sa3-hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44%; text-align: center; padding: 24px; border-radius: 50%; aspect-ratio: 1 / 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: --surface--; border: 1px solid --bordercolor--;
  }
  .modulex-sa3-eyebrow { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: --accent--; }
  .modulex-sa3-title { margin: 0 0 8px; font-size: clamp(1.3rem, 1rem + 1.4vw, 2rem); line-height: 1.2; color: --textcolor--; }
  .modulex-sa3-desc { margin: 0; font-size: 0.95rem; line-height: 1.6; color: --mutedcolor--; }

  .modulex-sa3-list { list-style: none; margin: 0; padding: 0; }
  .modulex-sa3-step {
    --yon: 1; --r: 38cqi;
    position: absolute; top: 50%; left: 50%; width: 26cqi; max-width: 210px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
    transform: translate(-50%, -50%) rotate(calc(var(--a) * var(--yon))) translateY(calc(-1 * var(--r))) rotate(calc(-1 * var(--a) * var(--yon)));
  }
  [dir="rtl"] .modulex-sa3-step { --yon: -1; }
  .modulex-sa3-no {
    display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%;
    background: --accent--; color: --accentText--; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 6px --bgcolor--;
  }
  .modulex-sa3-metin { padding: 8px 10px; border-radius: 12px; background: --bgcolor--; }
  .modulex-sa3-h { margin: 0 0 4px; font-size: 1.02rem; line-height: 1.3; color: --textcolor--; }
  .modulex-sa3-p { margin: 0; font-size: 0.88rem; line-height: 1.5; color: --mutedcolor--; }

  /* Dar ekran: halka yerine dikey numaralı liste, merkez başlık üstte */
  @media (max-width: 760px) {
    .modulex-sa3-halka { aspect-ratio: auto; container-type: normal; }
    .modulex-sa3-halka::before { display: none; }
    .modulex-sa3-hub { position: static; transform: none; width: auto; aspect-ratio: auto; border-radius: --radius--; margin-bottom: 24px; text-align: start; align-items: flex-start; }
    .modulex-sa3-list { display: grid; gap: 0; }
    .modulex-sa3-step {
      position: relative; top: auto; left: auto; width: auto; max-width: none; transform: none;
      flex-direction: row; align-items: flex-start; text-align: start; gap: 16px; padding-bottom: 20px;
    }
    /* adımları bağlayan dikey çizgi */
    .modulex-sa3-step:not(:last-child)::before {
      content: ""; position: absolute; inset-inline-start: 27px; top: 56px; bottom: 0; width: 2px;
      background: color-mix(in srgb, --accent-- 40%, transparent);
    }
    .modulex-sa3-no { flex: 0 0 auto; }
    .modulex-sa3-metin { padding: 4px 0 0; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sa3 *, .modulex-sa3 *::before, .modulex-sa3 *::after { animation: none !important; transition: none !important; }
  }
</style>
