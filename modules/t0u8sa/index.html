<section class="modulex-galeri-film-serit{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-galeri-film-serit-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* galeri-film-serit — Izgara değil tek sıra yatay şerit (scroll-snap + önceki/sonraki): az yer kaplar, sinematik his; görseller hafif soluk, üzerine gelince renklenir. */
  .modulex-galeri-film-serit { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-galeri-film-serit *, .modulex-galeri-film-serit *::before, .modulex-galeri-film-serit *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-galeri-film-serit :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-galeri-film-serit :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-galeri-film-serit :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-galeri-film-serit :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-galeri-film-serit img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-galeri-film-serit) img { height: auto; }
  .modulex-galeri-film-serit [hidden] { display: none !important; }
  .modulex-galeri-film-serit :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-galeri-film-serit :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-galeri-film-serit-ic { max-width: --max--; margin-inline: auto; }
  .modulex-galeri-film-serit-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-galeri-film-serit--bassiz .modulex-galeri-film-serit-bas { display: none; }
  .modulex-galeri-film-serit-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-galeri-film-serit-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-galeri-film-serit-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-galeri-film-serit-bas { max-width: 760px; }
  .modulex-galeri-film-serit-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-galeri-film-serit-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-galeri-film-serit-dugme:hover { transform: translateY(-2px); }
  .modulex-galeri-film-serit-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-galeri-film-serit-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-galeri-film-serit-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-galeri-film-serit-serit { position: relative; padding-block: 30px; background: color-mix(in srgb, --text-- 6%, --bg--); border-radius: 6px; }
  .modulex-galeri-film-serit-serit::before, .modulex-galeri-film-serit-serit::after { content: ""; position: absolute; inset-inline: 0; height: 12px; background: repeating-linear-gradient(90deg, transparent 0 10px, color-mix(in srgb, --text-- 32%, transparent) 10px 22px, transparent 22px 32px); border-radius: 3px; }
  .modulex-galeri-film-serit-serit::before { inset-block-start: 9px; }
  .modulex-galeri-film-serit-serit::after { inset-block-end: 9px; }
  .modulex-galeri-film-serit-ray { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(250px, 30vw, 380px); gap: 14px; padding-inline: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .modulex-galeri-film-serit-ray::-webkit-scrollbar { display: none; }
  .modulex-galeri-film-serit-kare { position: relative; display: grid; gap: 10px; scroll-snap-align: start; }
  .modulex-galeri-film-serit-no { position: absolute; inset-block-start: 8px; inset-inline-start: 10px; z-index: 1; padding: 2px 8px; border-radius: 4px; background: --bg--; color: --accentInk--; font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-galeri-film-serit-g { width: 100%; aspect-ratio: 4 / 3; height: auto; object-fit: cover; border-radius: 4px; filter: saturate(0.55); transition: filter 0.4s ease; }
  .modulex-galeri-film-serit-kare:hover .modulex-galeri-film-serit-g { filter: none; }
  .modulex-galeri-film-serit-alt { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .modulex-galeri-film-serit-kontrol .modulex-galeri-film-serit-ok { background: transparent; color: --text--; }
  @media (max-width: 768px) { .modulex-galeri-film-serit-ray { grid-auto-columns: 78%; } }
  .modulex-galeri-film-serit-yer { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; background: color-mix(in srgb, --accent-- 14%, --kartBg--); color: --accentInk--; }
  .modulex-galeri-film-serit-yer .material-symbols-outlined { font-size: 40px; }
  .modulex-galeri-film-serit-bag { color: inherit; text-decoration: none; }
  .modulex-galeri-film-serit-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-galeri-film-serit-kbaslik { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .modulex-galeri-film-serit-kmetin { color: --muted--; font-size: 0.95rem; line-height: 1.6; }
  .modulex-galeri-film-serit-kat { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-galeri-film-serit-kontrol { display: flex; gap: 10px; justify-content: flex-end; margin-block-start: 18px; }
  .modulex-galeri-film-serit-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: --kartBg--; color: --text--; transition: background 0.25s ease, color 0.25s ease, opacity 0.25s ease; }
  .modulex-galeri-film-serit-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-galeri-film-serit-ok:disabled { opacity: 0.4; cursor: default; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-film-serit :is(.modulex-galeri-film-serit-baslik, .modulex-galeri-film-serit-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-film-serit-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-galeri-film-serit { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-galeri-film-serit *, .modulex-galeri-film-serit *::before, .modulex-galeri-film-serit *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-galeri-film-serit";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
